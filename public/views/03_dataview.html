<!DOCTYPE html>
<html>
	<head>
		<!-- meta block -->
		<title>Dataview. Getting data</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" charset="utf-8" />
		<link rel="stylesheet" href="../assets/css/index.css" />
		<!-- Suite -->
		<link rel="stylesheet" href="https://cdn.dhtmlx.com/suite/edge/suite.css" />
		<script type="text/javascript" src="https://cdn.dhtmlx.com/suite/edge/suite.js"></script>
		<!-- Browser theme -->
		<link rel="icon" type="image/png" sizes="16x16" href="../assets/static/favicon.ico" />
		<meta name="theme-color" content="#4b4b4b" />
		<!-- Icons -->
		<link rel="stylesheet" href="https://cdn.materialdesignicons.com/5.5.55/css/materialdesignicons.min.css" />
		<!-- custom sample head -->
		<style>
			/* css template for DHTMLX Dataview */
			/* the latest version is available here: https://snippet.dhtmlx.com/dataview_template_d */
			/* you can find more css templates here: https://dhtmlx.com/docs/products/dhtmlxSuite/styling */
			.dhx_dataview_template_d_box {
				background-color: transparent;
			}

			.dhx_dataview_template_d_box .dhx_dataview-item {
				padding: 0;
				border: var(--dhx-border);
				background-color: var(--dhx-background-primary);
				overflow: hidden;
			}

			.dhx_dataview_template_d {
				display: -webkit-box;
				display: -ms-flexbox;
				display: flex;
				width: 100%;
				height: 136px;
				padding: 12px;
			}

			.dhx_dataview_template_d__inside {
				display: -webkit-box;
				display: -ms-flexbox;
				display: flex;
				width: 100%;
			}

			.dhx_dataview_template_d__picture {
				width: 110px;
				min-width: 110px;
				background: center center/cover no-repeat #f7f7f7;
			}

			.dhx_dataview_template_d__picture:before {
				content: "";
				display: block;
				padding-top: 100%;
			}

			.dhx_dataview_template_d__body {
				padding-left: 12px;
				min-width: 250px;
			}

			.dhx_dataview_template_d__title,
			.dhx_dataview_template_d__text {
				font-family: var(--dhx-font-family);
				font-size: var(--dhx-font-size-normal);
				line-height: var(--dhx-line-height-normal);
				font-weight: var(--dhx-font-weight-regular);
				white-space: nowrap;
				text-overflow: ellipsis;
				overflow: hidden;
			}

			.dhx_dataview_template_d__title {
				color: var(--dhx-font-color-primary);
				font-weight: var(--dhx-font-weight-medium);
			}

			.dhx_dataview_template_d__row {
				display: -webkit-box;
				display: -ms-flexbox;
				display: flex;
				-webkit-box-align: center;
				-ms-flex-align: center;
				align-items: center;
				margin: 4px 0;
			}

			.dhx_dataview_template_d__icon {
				font-size: 18px;
				margin-right: 4px;
				color: var(--dhx-font-color-primary);
			}

			.dhx_dataview_template_d__text {
				color: var(--dhx-font-color-primary);
			}

			.dhx_dataview_template_d__link {
				color: var(--dhx-color-primary);
			}
			/* end of code for dataview_template_d */
		</style>
	</head>
	<body>
		<header class="dhx_sample-header">
			<div class="dhx_sample-header__main">
				<nav class="dhx_sample-header__breadcrumbs">
					<ul class="dhx_sample-header-breadcrumbs">
						<li class="dhx_sample-header-breadcrumbs__item">
							<a href="../index.html" class="dhx_sample-header-breadcrumbs__link">NodeJS samles</a>
						</li>
						<li class="dhx_sample-header-breadcrumbs__item">
							<span class="dhx_sample-header-breadcrumbs__link">Dataview. Getting data</span>
						</li>
					</ul>
				</nav>
			</div>
		</header>
		<section class="dhx_sample-container">
			<div class="dhx_sample-container__widget" id="dataview"></div>
		</section>
		<script>
			const URL = "http://localhost:3000/personal/";
			const IMG_URL = "http://localhost:3000/images/";

			const template = ({ name, photo, post, phone, birthday, mail }) => (`
				<div class="dhx_dataview_template_d">
					<div class="dhx_dataview_template_d__inside">
						<div class="dhx_dataview_template_d__picture" style="background-image: url(${IMG_URL + photo});"></div>
						<div class="dhx_dataview_template_d__body">
							<span class="dhx_dataview_template_d__title">${name}</span>
							<div class="dhx_dataview_template_d__row">
								<span class="dhx_dataview_template_d__text">${post}</span>
							</div>
							<div class="dhx_dataview_template_d__row">
								<span class="dhx_dataview_template_d__icon mdi mdi-cellphone-android"></span>
								<span class="dhx_dataview_template_d__text">${phone}</span>
							</div>
							<div class="dhx_dataview_template_d__row">
								<span class="dhx_dataview_template_d__icon mdi mdi-cake-variant"></span>
								<span class="dhx_dataview_template_d__text">${birthday}</span>
							</div>
							<div class="dhx_dataview_template_d__row">
								<span class="dhx_dataview_template_d__icon mdi mdi-email-outline"></span>
								<span class="dhx_dataview_template_d__text">
									<a class="dhx_dataview_template_d__link" href="mailto:${mail}" target="_blank">${mail}</a>
								</span>
							</div>
						</div>
					</div>
				</div>
			`);

			const dataview = new dhx.DataView("dataview", {
				itemsInRow: 2,
				gap: 10,
				css: "dhx_widget--bordered dhx_dataview_template_d_box",
				dragMode: "both",
				template,
				multiselection: true,
				keyNavigation: true,
			});

			dataview.data
				.load(URL)
				.then(function (res) {
					displayMessage("Data loaded successfully");
				})
				.catch(function (res) {
					displayMessage(res.statusText || "Resource Not Found", true);
				});

			function displayMessage(text, err) {
				const css = err
					? "dhx_message--error"
					: "dhx_message--success";

				dhx.message({text, expire: 3000, css });
			}
		</script>
	</body>
</html>
