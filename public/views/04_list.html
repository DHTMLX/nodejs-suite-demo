<!DOCTYPE html>
<html>
	<head>
		<!-- meta block -->
		<title>List. Getting data</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" charset="utf-8" />
		<link rel="stylesheet" href="../assets/css/index.css" />
		<!-- Suite -->
		<link rel="stylesheet" href="https://cdn.dhtmlx.com/suite/edge/suite.css" />
		<script type="text/javascript" src="https://cdn.dhtmlx.com/suite/edge/suite.js"></script>
		<!-- Browser theme -->
		<link rel="icon" type="image/png" sizes="16x16" href="../assets/static/favicon.ico" />
		<meta name="theme-color" content="#4b4b4b" />
		<!-- custom sample head -->
		<style>
			.dhx-demo_personal-card p {
				margin: 0;
				color: rgba(0, 0, 0, 0.7);
				font-size: 14px;
				line-height: 20px;
			}
		</style>
	</head>
	<body>
		<header class="dhx_sample-header">
			<div class="dhx_sample-header__main">
				<nav class="dhx_sample-header__breadcrumbs">
					<ul class="dhx_sample-header-breadcrumbs">
						<li class="dhx_sample-header-breadcrumbs__item">
							<a href="../index.html" class="dhx_sample-header-breadcrumbs__link">NodeJS samles</a>
						</li>
						<li class="dhx_sample-header-breadcrumbs__item">
							<span class="dhx_sample-header-breadcrumbs__link">List. Getting data</span>
						</li>
					</ul>
				</nav>
			</div>
		</header>
		<section class="dhx_sample-container">
			<div class="dhx_sample-container__widget" id="list"></div>
		</section>
		<script>
			const URL = "http://localhost:3000/personal/";

			const list = new dhx.List("list", {
				css: "dhx_widget--bordered",
				dragMode: "both",
				multiselection: true,
				template: ({ name, post, phone, start, birthday }) => (`
					<div class="dhx-demo_personal-card">
						<p><b>Name: </b>${name}</p>
						<p><b>Post: </b>${post}</p>
						<p><b>Phone: </b>${phone}</p>
						<p><b>Beginning of work: </b>${start}</p>
						<p><b>Birthday: </b>${birthday}</p>
					</div>
				`),
				keyNavigation: true,
			});

			list.data
				.load(URL)
				.then(function (res) {
					displayMessage("Data loaded successfully");
				})
				.catch(function (res) {
					displayMessage(res.statusText || "Resource Not Found", true);
				});

			function displayMessage(text, err) {
				const css = err
					? "dhx_message--error"
					: "dhx_message--success";

				dhx.message({text, expire: 3000, css });
			}
		</script>
	</body>
</html>
