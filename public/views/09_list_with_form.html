<!DOCTYPE html>
<html>
	<head>
		<!-- meta block -->
		<title>List with Form and Window. Getting, editing, deleting, and sending data</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" charset="utf-8" />
		<link rel="stylesheet" href="../assets/css/index.css" />
		<!-- Suite -->
		<link rel="stylesheet" href="https://cdn.dhtmlx.com/suite/edge/suite.css" />
		<script type="text/javascript" src="https://cdn.dhtmlx.com/suite/edge/suite.js"></script>
		<!-- Browser theme -->
		<link rel="icon" type="image/png" sizes="16x16" href="../assets/static/favicon.ico" />
		<meta name="theme-color" content="#4b4b4b" />
		<!-- custom sample head -->
		<link rel="stylesheet" href="https://cdn.materialdesignicons.com/5.5.55/css/materialdesignicons.min.css" />
		<style>
			.dhx-demo_personal-card p {
				margin: 0;
				color: rgba(0, 0, 0, 0.7);
				font-size: 14px;
				line-height: 20px;
			}
			.dhx_form-button .dhx_button {
				margin-left: 10px;
				width: 110px;
			}
		</style>
	</head>
	<body>
		<header class="dhx_sample-header">
			<div class="dhx_sample-header__main">
				<nav class="dhx_sample-header__breadcrumbs">
					<ul class="dhx_sample-header-breadcrumbs">
						<li class="dhx_sample-header-breadcrumbs__item">
							<a href="../index.html" class="dhx_sample-header-breadcrumbs__link">NodeJS samles</a>
						</li>
						<li class="dhx_sample-header-breadcrumbs__item">
							<span class="dhx_sample-header-breadcrumbs__link"
								>List with Form and Window. Getting, editing, deleting, and sending data</span
							>
						</li>
					</ul>
				</nav>
			</div>
		</header>
		<section class="dhx_sample-container--column">
			<div class="dhx_sample-container__toolbar" id="toolbar"></div>
			<div class="dhx_sample-container__widget" id="list"></div>
		</section>
		<script>
			const URL = "http://localhost:3000/personal/";

			const list = new dhx.List("list", {
				css: "dhx_widget--bordered",
				dragMode: "both",
				template: ({ name, post, phone, start, birthday }) => (`
					<div class="dhx-demo_personal-card">
						<p><b>Name: </b>${name}</p>
						<p><b>Post: </b>${post}</p>
						<p><b>Phone: </b>${phone}</p>
						<p><b>Beginning of work: </b>${start}</p>
						<p><b>Birthday: </b>${birthday}</p>
					</div>
				`),
				keyNavigation: true,
			});

			list.data
				.load(URL)
				.then(function (res) {
					displayMessage("Data loaded successfully");
				})
				.catch(function (res) {
					displayMessage(res.statusText || "Resource Not Found", true);
				});

			const toolbar = new dhx.Toolbar("toolbar", {
				css: "dhx_widget--bordered",
				data: [
					{ type: "spacer" },
					{ id: "delete", type: "button", value: "Delete card", size: "small", view: "link", hidden: true },
					{ id: "edit", type: "button", value: "Edit card", size: "small", view: "link", hidden: true },
					{ id: "add", type: "button", value: "Add new card", size: "small" },
				]
			});

			toolbar.events.on("click", function (id) {
				switch (id) {
					case "add":
						openWindow("add");
						break;
					case "edit":
						openWindow("edit");
						break;
					case "delete":
						deleteItem();
						break;
				}
			});

			list.events.on("AfterSelect", function () {
				if (list.selection.getItem()) {
					toolbar.show();
				}
			});

			const form = new dhx.Form(null, {
				width: 500,
				height: 600,
				rows: [
					{
						name: "name",
						type: "input",
						label: "Name",
						placeholder: "John Doe",
						required: true,
					},
					{
						name: "post",
						type: "input",
						label: "Position",
						placeholder: "Resident",
						required: true,
					},
					{
						name: "phone",
						type: "input",
						label: "Phone number",
						placeholder: "(405) 500-2020",
						icon: "mdi mdi-cellphone-android",
						required: true,
						patternMask: "(000) 000-0000",
						validation:  (value) => (value.trim().length === 14)
					},
					{
						name: "start",
						type: "datepicker",
						label: "Works since",
						required: true,
						editable: true,
						placeholder: "25.12.1991",
						dateFormat: "%d.%m.%Y",
					},
					{
						name: "birthday",
						type: "datepicker",
						label: "Birthday",
						required: true,
						editable: true,
						placeholder: "25.12.1991",
						dateFormat: "%d.%m.%Y",
					},
					{ name: "mail", type: "input", hidden: true },
					{ name: "photo", type: "input", hidden: true },
					{ type: "spacer" },
					{
						align: "between",
						cols: [
							{
								type: "spacer",
							},
							{
								name: "cancel",
								type: "button",
								text: "Cancel",
								view: "link",
								color: "primary",
								size: "small",
								css: "dhx_form-button"
							},
							{
								name: "editItem",
								type: "button",
								text: "Save",
								view: "flat",
								color: "primary",
								size: "small",
								css: "dhx_form-button"
							},
							{
								name: "addItem",
								type: "button",
								text: "Save",
								view: "flat",
								color: "primary",
								size: "small",
								css: "dhx_form-button"
							},
						],
					},
				],
			});

			form.events.on("click", function (id) {
				switch (id) {
					case "addItem":
						addItem();
						break;
					case "editItem":
						editItem();
						break;
					case "cancel":
						closeWindow();
						break;
				}
				form.validate(true) && id !== "cancel" && closeWindow();
			});

			form.events.on("afterValidate", function (id, value, isValid) {
				if (!isValid) {
					displayMessage(id + " invalid data: " + value, true);
				}
			});

			let dhxwindow;

			function openWindow(action) {
				let title;
				if (action === "add") {
					title = "Add new card";
					form.getItem("addItem").show();
					form.getItem("editItem").hide();
				} else {
					title = "Edit card";
					form.getItem("addItem").hide();
					form.getItem("editItem").show();
				}

				const selectedItem = list.selection.getItem();

				selectedItem &&
					action === "edit" &&
					form.setValue({
						name: selectedItem.name,
						post: selectedItem.post,
						phone: selectedItem.phone,
						start: selectedItem.start,
						birthday: selectedItem.birthday,
						mail: selectedItem.mail,
						photo: selectedItem.photo,
					});

				form.clear("validation");

				dhxwindow = new dhx.Window({
					width: form.config.width,
					height: form.config.height + 110,
					title: title,
					modal: true,
				});

				dhxwindow.events.on("AfterHide", function () {
					form.clear();
				});

				dhxwindow.attach(form);
				dhxwindow.show();
			}

			function closeWindow() {
				dhxwindow.hide();
			}

			function displayMessage(text, err) {
				const css = err
					? "dhx_message--error"
					: "dhx_message--success";

				dhx.message({text, expire: 3000, css });
			}

			function deleteItem() {
				const item = list.selection.getItem();
				dhx.ajax
					.delete(URL + item.id)
					.then(function () {
						list.data.remove(item.id);
						displayMessage(item.name + " - Removed");
					})
					.catch(function (error) {
						displayMessage(error.message, true);
					});
			}

			function editItem() {
				if (!form.validate()) return;

				const item = list.selection.getItem();
				const data = getItemData();

				dhx.ajax
					.put(URL + item.id, data)
					.then(function () {
						list.data.update(item.id, data);
						displayMessage(data.name + " - Edited");
					})
					.catch(function (error) {
						displayMessage(error.message, true);
					});
			}

			function addItem() {
				if (!form.validate()) return;

				const data = getItemData();
				dhx.ajax
					.post(URL, data)
					.then(function (res) {
						data.id = res.id;
						list.data.add(data);
						displayMessage(data.name + " - Added");
					})
					.catch(function (error) {
						displayMessage(error.message, true);
					});
			}

			function getItemData() {
				const data = form.getValue();
				return {
					name: data.name,
					post: data.post,
					phone: data.phone,
					birthday: data.birthday,
					start: data.start,
					mail: data.mail || "",
				};
			}
		</script>
	</body>
</html>
