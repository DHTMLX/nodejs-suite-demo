<!DOCTYPE html>
<html>
	<head>
		<!-- meta block -->
		<title>Dataview with Form and Window. Getting, editing, deleting, and sending data</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" charset="utf-8" />
		<link rel="stylesheet" href="../assets/css/index.css" />
		<!-- Suite -->
		<link rel="stylesheet" href="https://cdn.dhtmlx.com/suite/edge/suite.css" />
		<script type="text/javascript" src="https://cdn.dhtmlx.com/suite/edge/suite.js"></script>
		<!-- Icons -->
		<link rel="stylesheet" href="https://cdn.materialdesignicons.com/5.5.55/css/materialdesignicons.min.css" />
		<!-- Browser theme -->
		<link rel="icon" type="image/png" sizes="16x16" href="../assets/static/favicon.ico" />
		<meta name="theme-color" content="#4b4b4b" />
		<!-- custom sample head -->
		<style>
			/* css template for DHTMLX Dataview */
			/* the latest version is available here: https://snippet.dhtmlx.com/dataview_template_d */
			/* you can find more css templates here: https://dhtmlx.com/docs/products/dhtmlxSuite/styling */
			.dhx_dataview_template_d_box {
				background-color: transparent;
			}

			.dhx_dataview_template_d_box .dhx_dataview-item {
				padding: 0;
				border: var(--dhx-border);
				background-color: var(--dhx-background-primary);
				overflow: hidden;
			}

			.dhx_dataview_template_d {
				display: -webkit-box;
				display: -ms-flexbox;
				display: flex;
				width: 100%;
				height: 136px;
				padding: 12px;
			}

			.dhx_dataview_template_d__inside {
				display: -webkit-box;
				display: -ms-flexbox;
				display: flex;
				width: 100%;
			}

			.dhx_dataview_template_d__picture {
				width: 110px;
				min-width: 110px;
				background: center center/cover no-repeat #f7f7f7;
			}

			.dhx_dataview_template_d__picture:before {
				content: "";
				display: block;
				padding-top: 100%;
			}

			.dhx_dataview_template_d__body {
				padding-left: 12px;
				min-width: 250px;
			}

			.dhx_dataview_template_d__title,
			.dhx_dataview_template_d__text {
				font-family: var(--dhx-font-family);
				font-size: var(--dhx-font-size-normal);
				line-height: var(--dhx-line-height-normal);
				font-weight: var(--dhx-font-weight-regular);
				white-space: nowrap;
				text-overflow: ellipsis;
				overflow: hidden;
			}

			.dhx_dataview_template_d__title {
				color: var(--dhx-font-color-primary);
				font-weight: var(--dhx-font-weight-medium);
			}

			.dhx_dataview_template_d__row {
				display: -webkit-box;
				display: -ms-flexbox;
				display: flex;
				-webkit-box-align: center;
				-ms-flex-align: center;
				align-items: center;
				margin: 4px 0;
			}

			.dhx_dataview_template_d__icon {
				font-size: 18px;
				margin-right: 4px;
				color: var(--dhx-font-color-primary);
			}

			.dhx_dataview_template_d__text {
				color: var(--dhx-font-color-primary);
			}

			.dhx_dataview_template_d__link {
				color: var(--dhx-color-primary);
			}
			/* end of code for dataview_template_d */
			.dhx_form-button .dhx_button {
				margin-left: 10px;
				width: 110px;
			}
		</style>
	</head>
	<body>
		<header class="dhx_sample-header">
			<div class="dhx_sample-header__main">
				<nav class="dhx_sample-header__breadcrumbs">
					<ul class="dhx_sample-header-breadcrumbs">
						<li class="dhx_sample-header-breadcrumbs__item">
							<a href="../index.html" class="dhx_sample-header-breadcrumbs__link">NodeJS samles</a>
						</li>
						<li class="dhx_sample-header-breadcrumbs__item">
							<span class="dhx_sample-header-breadcrumbs__link"
								>Dataview with Form and Window. Getting, editing, deleting, and sending data</span
							>
						</li>
					</ul>
				</nav>
			</div>
		</header>
		<section class="dhx_sample-container--column">
			<div class="dhx_sample-container__toolbar" id="toolbar"></div>
			<div class="dhx_sample-container__widget" id="dataview"></div>
		</section>
		<script>
			const URL = "http://localhost:3000/personal/";
			const UPLOADER_URL = "http://localhost:3000/form/images";
			const IMG_URL = "http://localhost:3000/images/";

			const template = ({ name, photo, post, phone, birthday, mail }) => (`
				<div class="dhx_dataview_template_d">
					<div class="dhx_dataview_template_d__inside">
						<div class="dhx_dataview_template_d__picture" style="background-image: url(${IMG_URL + photo});"></div>
						<div class="dhx_dataview_template_d__body">
							<span class="dhx_dataview_template_d__title">${name}</span>
							<div class="dhx_dataview_template_d__row">
								<span class="dhx_dataview_template_d__text">${post}</span>
							</div>
							<div class="dhx_dataview_template_d__row">
								<span class="dhx_dataview_template_d__icon mdi mdi-cellphone-android"></span>
								<span class="dhx_dataview_template_d__text">${phone}</span>
							</div>
							<div class="dhx_dataview_template_d__row">
								<span class="dhx_dataview_template_d__icon mdi mdi-cake-variant"></span>
								<span class="dhx_dataview_template_d__text">${birthday}</span>
							</div>
							<div class="dhx_dataview_template_d__row">
								<span class="dhx_dataview_template_d__icon mdi mdi-email-outline"></span>
								<span class="dhx_dataview_template_d__text">
									<a class="dhx_dataview_template_d__link" href="mailto:${mail}" target="_blank">${mail}</a>
								</span>
							</div>
						</div>
					</div>
				</div>
			`);

			const dataview = new dhx.DataView("dataview", {
				itemsInRow: 2,
				gap: 10,
				css: "dhx_widget--bordered dhx_dataview_template_d_box",
				dragMode: "both",
				keyNavigation: true,
				template,
			});

			dataview.data
				.load(URL)
				.then(function (res) {
					displayMessage("Data loaded successfully");
				})
				.catch(function (res) {
					displayMessage(res.statusText || "Resource Not Found", true);
				});

			const toolbar = new dhx.Toolbar("toolbar", {
				css: "dhx_widget--bordered",
				data: [
					{ type: "spacer" },
					{ id: "delete", type: "button", value: "Delete card", size: "small", view: "link", hidden: true },
					{ id: "edit", type: "button", value: "Edit card", size: "small", view: "link", hidden: true },
					{ id: "add", type: "button", value: "Add new card", size: "small" },
				]
			});

			toolbar.events.on("click", function (id) {
				switch (id) {
					case "add":
						openWindow("add");
						break;
					case "edit":
						openWindow("edit");
						break;
					case "delete":
						deleteItem();
						break;
				}
			});

			dataview.events.on("AfterSelect", function () {
				if (dataview.selection.getItem()) {
					toolbar.show();
				}
			});

			const form = new dhx.Form(null, {
				width: 500,
				height: 630,
				rows: [
					{
						name: "name",
						type: "input",
						label: "Employee name",
						placeholder: "John Doe",
						required: true,
					},
					{
						name: "post",
						type: "input",
						label: "Position",
						placeholder: "Resident",
						required: true,
					},
					{
						name: "phone",
						type: "input",
						label: "Phone number",
						placeholder: "(405) 500-2020",
						icon: "mdi mdi-cellphone-android",
						required: true,
						patternMask: "(000) 000-0000",
						validation: v => (v.startsWith("(") ? v.trim().length === 14 : v.trim().length === 10)
					},
					{
						name: "birthday",
						type: "datepicker",
						label: "Birthday",
						required: true,
						editable: true,
						placeholder: "25.12.1991",
						dateFormat: "%d.%m.%Y"
					},
					{
						name: "mail",
						type: "input",
						label: "Email",
						icon: "mdi mdi-email-outline",
						placeholder: "jd@mail.name",
						required: true,
						validation: "email"
					},
					{
						name: "photo",
						type: "simplevault",
						label: "Photo",
						target: UPLOADER_URL
					},
					{
						name: "start",
						type: "input",
						hidden: true,
					},
					{
						type: "spacer",
					},
					{
						align: "between",
						cols: [
							{ type: "spacer" },
							{
								name: "cancel",
								type: "button",
								text: "Cancel",
								view: "link",
								color: "primary",
								size: "small",
								css: "dhx_form-button",
							},
							{
								name: "editItem",
								type: "button",
								text: "Save",
								view: "flat",
								color: "primary",
								size: "small",
								css: "dhx_form-button",
							},
							{
								name: "addItem",
								type: "button",
								text: "Save",
								view: "flat",
								color: "primary",
								size: "small",
								css: "dhx_form-button"
							},
						],
					},
				],
			});

			form.events.on("click", function (id) {
				switch (id) {
					case "addItem":
						addItem();
						break;
					case "editItem":
						editItem();
						break;
					case "cancel":
						closeWindow();
						break;
				}
				form.validate(true) && id !== "cancel" && closeWindow();
			});

			form.events.on("afterValidate", function (id, value, isValid) {
				if (!isValid) {
					displayMessage(id + " invalid data: " + value, true);
				}
			});

			let dhxwindow;

			function openWindow(action) {
				let title;
				if (action === "add") {
					title = "Add new card";
					form.getItem("addItem").show();
					form.getItem("editItem").hide();
				} else {
					title = "Edit card";
					form.getItem("addItem").hide();
					form.getItem("editItem").show();
				}

				const selectedItem = dataview.selection.getItem();
				if (selectedItem && action === "edit") {
					form.setValue({
						...selectedItem,
						photo: [
							{
								file: { name: selectedItem.photo },
							},
						],
					});
				} else {
					form.clear();
				}

				form.clear("validation");

				dhxwindow = new dhx.Window({
					width: form.config.width,
					height: form.config.height + 110,
					modal: true,
					title,
				});

				dhxwindow.attach(form);
				dhxwindow.show();
			}

			function closeWindow() {
				dhxwindow.hide();
			}

			function displayMessage(text, err) {
				const css = err
					? "dhx_message--error"
					: "dhx_message--success";

				dhx.message({text, expire: 3000, css });
			}

			function deleteItem() {
				const item = dataview.selection.getItem();

				dhx.ajax
					.delete(URL + item.id)
					.then(function () {
						dataview.data.remove(item.id);
						displayMessage(item.name + " - Removed");
					})
					.catch(function (error) {
						displayMessage(error.message, true);
					});
			}

			function editItem() {
				if (!form.validate()) return;

				const item = dataview.selection.getItem();
				const data = getItemData();

				form.getItem("photo").send();
				dhx.ajax
					.put(URL + item.id, data)
					.then(function () {
						dataview.data.update(item.id, data);
						displayMessage(data.name + " - Edited");
					})
					.catch(function (error) {
						displayMessage(error.message, true);
					});
			}

			function addItem() {
				if (!form.validate()) return;

				const data = getItemData();

				form.getItem("photo").send();
				dhx.ajax
					.post(URL, data)
					.then(function (res) {
						data.id = res.id;
						dataview.data.add(data);
						displayMessage(data.name + " - Added");
					})
					.catch(function (error) {
						displayMessage(error.message, true);
					});
			}

			function getItemData() {
				const data = form.getValue();
				return {
					...data,
					photo: (data.photo.length && data.photo[0].file.name) || "avatar.png",
				};
			}
		</script>
	</body>
</html>
