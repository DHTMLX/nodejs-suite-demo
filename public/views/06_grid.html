<!DOCTYPE html>
<html>
	<head>
		<!-- meta block -->
		<title>Grid. Getting data, inline editing, and sending data</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" charset="utf-8" />
		<link rel="stylesheet" href="../assets/css/index.css" />
		<!-- Suite -->
		<link rel="stylesheet" href="https://cdn.dhtmlx.com/suite/edge/suite.css" />
		<script type="text/javascript" src="https://cdn.dhtmlx.com/suite/edge/suite.js"></script>
		<!-- Browser theme -->
		<link rel="icon" type="image/png" sizes="16x16" href="../assets/static/favicon.ico" />
		<meta name="theme-color" content="#4b4b4b" />
		<!-- custom sample head -->
	</head>
	<body>
		<header class="dhx_sample-header">
			<div class="dhx_sample-header__main">
				<nav class="dhx_sample-header__breadcrumbs">
					<ul class="dhx_sample-header-breadcrumbs">
						<li class="dhx_sample-header-breadcrumbs__item">
							<a href="../index.html" class="dhx_sample-header-breadcrumbs__link">NodeJS samles</a>
						</li>
						<li class="dhx_sample-header-breadcrumbs__item">
							<span class="dhx_sample-header-breadcrumbs__link">Grid. Getting data, inline editing, and sending data</span>
						</li>
					</ul>
				</nav>
			</div>
		</header>
		<section class="dhx_sample-container">
			<div class="dhx_sample-container__widget--grid" id="grid"></div>
		</section>
		<script>
			const URL = "http://localhost:3000/projects/";
			const columns = [
				{ id: "project", header: [{ text: "Project" }, { content: "comboFilter" }] },
				{ id: "status",	header: [{ text: "Status" }, { content: "selectFilter" }], editorType: "select", options: ["Done", "In Progress", "Not Started"] },
				{ id: "paid", header: [{ text: "Paid", rowspan: 2 }], type: "boolean" },
				{ id: "owner", header: [{ text: "Owner" }, { content: "inputFilter" }] },
				{ id: "hours", header: [{ text: "Number of hours" }, { content: "inputFilter" }] },
				{ id: "start_date",	header: [{ text: "Calendar", colspan: 2 }, { text: "Start date" }],	type: "date", dateFormat: "%d/%m/%Y" },
				{ id: "end_date", header: ["", { text: "End date" }], type: "date", dateFormat: "%d/%m/%Y" },
				{ id: "balance", header: [{ text: "Balance" }, { content: "inputFilter" }], autoWidth: true, },
			];

			columns.forEach(column => column.minWidth = 155);

			const grid = new dhx.Grid("grid", {
				columns,
				selection: true,
				editable: true,
				resizable: true,
				dragMode: "both",
			});

			grid.data
				.load(URL)
				.then(function (res) {
					displayMessage("Data loaded successfully");
				})
				.catch(function (res) {
					displayMessage(res.statusText || "Resource Not Found", true);
				});

			grid.data.events.on("change", function (id, method, data) {
				if (method === "update") {
					dhx.ajax
						.put(URL + id, data)
						.then(function () {
							displayMessage(data.project + " - Edited");
						})
						.catch(function (error) {
							displayMessage(error.message, true);
						});
				}
			});

			function displayMessage(text, err) {
				const css = err
					? "dhx_message--error"
					: "dhx_message--success";

				dhx.message({text, expire: 3000, css });
			}
		</script>
	</body>
</html>
