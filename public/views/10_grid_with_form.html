<!DOCTYPE html>
<html>
	<head>
		<!-- meta block -->
		<title>Grid with Form and Window. Getting, editing, deleting, and sending data</title>
		<meta name="viewport" content="width=device-width, initial-scale=1.0" charset="utf-8" />
		<link rel="stylesheet" href="../assets/css/index.css" />
		<!-- Suite -->
		<link rel="stylesheet" href="https://cdn.dhtmlx.com/suite/edge/suite.css" />
		<script type="text/javascript" src="https://cdn.dhtmlx.com/suite/edge/suite.js"></script>
		<!-- Browser theme -->
		<link rel="icon" type="image/png" sizes="16x16" href="../assets/static/favicon.ico" />
		<meta name="theme-color" content="#4b4b4b" />
		<!-- custom sample head -->
		<style>
			.dhx_form-button .dhx_button {
				margin-left: 10px;
				width: 110px;
			}
			.dhx_sample-container__toolbar,
			.dhx_sample-container__widget {
				width: 1000px;
			}
		</style>
	</head>
	<body>
		<header class="dhx_sample-header">
			<div class="dhx_sample-header__main">
				<nav class="dhx_sample-header__breadcrumbs">
					<ul class="dhx_sample-header-breadcrumbs">
						<li class="dhx_sample-header-breadcrumbs__item">
							<a href="../index.html" class="dhx_sample-header-breadcrumbs__link">NodeJS samles</a>
						</li>
						<li class="dhx_sample-header-breadcrumbs__item">
							<span class="dhx_sample-header-breadcrumbs__link"
								>Grid with Form and Window. Getting, editing, deleting, and sending data</span
							>
						</li>
					</ul>
				</nav>
			</div>
		</header>
		<section class="dhx_sample-container--column">
			<div class="dhx_sample-container__toolbar" id="toolbar"></div>
			<div class="dhx_sample-container__widget" id="grid"></div>
		</section>
		<script>
			const URL = "http://localhost:3000/projects/";

			const columns = [
				{ id: "project", header: [{ text: "Project" }, { content: "comboFilter" }] },
				{ id: "status",	header: [{ text: "Status" }, { content: "selectFilter" }], editorType: "select", options: ["Done", "In Progress", "Not Started"] },
				{ id: "paid", header: [{ text: "Paid", rowspan: 2 }], type: "boolean" },
				{ id: "owner", header: [{ text: "Owner" }, { content: "inputFilter" }] },
				{ id: "hours", header: [{ text: "Number of hours" }, { content: "inputFilter" }] },
				{ id: "start_date",	header: [{ text: "Calendar", colspan: 2 }, { text: "Start date" }],	type: "date", dateFormat: "%d/%m/%Y" },
				{ id: "end_date", header: ["", { text: "End date" }], type: "date", dateFormat: "%d/%m/%Y" },
				{ id: "balance", header: [{ text: "Balance" }, { content: "inputFilter" }], autoWidth: true, },
			];

			columns.forEach(column => column.minWidth = 155);

			const grid = new dhx.Grid("grid", {
				columns,
				selection: "row",
				resizable: true,
				dragMode: "both",
			});

			grid.data
				.load(URL)
				.then(function (res) {
					displayMessage("Data loaded successfully");
				})
				.catch(function (res) {
					displayMessage(res.statusText || "Resource Not Found", true);
				});

			const toolbar = new dhx.Toolbar("toolbar", {
				css: "dhx_widget--bordered",
				data: [
					{ type: "spacer" },
					{ id: "delete", type: "button", value: "Delete card", size: "small", view: "link", hidden: true },
					{ id: "edit", type: "button", value: "Edit card", size: "small", view: "link", hidden: true },
					{ id: "add", type: "button", value: "Add new card", size: "small" },
				]
			});

			toolbar.events.on("click", function (id) {
				switch (id) {
					case "add":
						openWindow("add");
						break;
					case "edit":
						openWindow("edit");
						break;
					case "delete":
						deleteItem();
						break;
				}
			});

			grid.events.on("AfterSelect", function (row) {
				if (row) toolbar.show();
			});

			const form = new dhx.Form(null, {
				width: 500,
				height: 630,
				rows: [
					{
						name: "project",
						type: "input",
						label: "Project",
						placeholder: "Project name",
						required: true,
					},
					{
						name: "status",
						type: "select",
						label: "Status",
						options: [
							{
								value: "Done",
								content: "Done",
							},
							{
								value: "Not Started",
								content: "Not Started",
							},
							{
								value: "In Progress",
								content: "In Progress",
							},
						],
					},
					{
						name: "owner",
						type: "input",
						label: "Owner",
						placeholder: "Mark Luis",
						required: true,
					},
					{
						name: "hours",
						type: "input",
						label: "Number of hourse",
						placeholder: "0",
						validation: "integer",
						required: true,
					},
					{
						name: "start_date",
						type: "datepicker",
						label: "Start date",
						required: true,
						placeholder: "25/12/2020",
						dateFormat: "%d/%m/%Y",
					},
					{
						name: "end_date",
						type: "datepicker",
						label: "End date",
						required: true,
						placeholder: "30/12/2020",
						dateFormat: "%d/%m/%Y",
					},
					{
						name: "balance",
						type: "input",
						label: "Balance",
						placeholder: "0",
						validation: "integer",
						required: true,
					},
					{ name: "paid", type: "checkbox", text: "Paid" },
					{ type: "spacer" },
					{
						align: "between",
						cols: [
							{
								type: "spacer",
							},
							{
								name: "cancel",
								type: "button",
								text: "Cancel",
								view: "link",
								color: "primary",
								size: "small",
								css: "dhx_form-button",
							},
							{
								name: "editItem",
								type: "button",
								text: "Save",
								view: "flat",
								color: "primary",
								size: "small",
								css: "dhx_form-button",
							},
							{
								name: "addItem",
								type: "button",
								text: "Save",
								view: "flat",
								color: "primary",
								size: "small",
								css: "dhx_form-button",
							},
						],
					},
				],
			});

			form.events.on("click", function (id) {
				switch (id) {
					case "addItem":
						addItem();
						break;
					case "editItem":
						editItem();
						break;
					case "cancel":
						closeWindow();
						break;
				}
				form.validate(true) && id !== "cancel" && closeWindow();
			});

			form.events.on("afterValidate", function (id, value, isValid) {
				if (!isValid) {
					displayMessage(id + " invalid data: " + value, true);
				}
			});

			let dhxwindow;

			function openWindow(action) {
				let title;
				if (action === "add") {
					title = "Add new card";
					form.getItem("addItem").show();
					form.getItem("editItem").hide();
				} else {
					title = "Edit card";
					form.getItem("addItem").hide();
					form.getItem("editItem").show();
				}

				const selectedItem = grid.selection.getCell();
				if (selectedItem && action === "edit") {
					form.setValue({ ...selectedItem.row });
				} else {
					form.clear();
				}

				form.clear("validation");

				dhxwindow = new dhx.Window({
					width: form.config.width,
					height: form.config.height + 110,
					modal: true,
					title,
				});

				dhxwindow.attach(form);
				dhxwindow.show();
			}

			function closeWindow() {
				dhxwindow.hide();
			}

			function displayMessage(text, err) {
				const css = err
					? "dhx_message--error"
					: "dhx_message--success";

				dhx.message({text, expire: 3000, css });
			}

			function deleteItem() {
				const selectedRow = grid.selection.getCell().row;
				dhx.ajax
					.delete(URL + selectedRow.id)
					.then(function () {
						grid.data.remove(selectedRow.id);
						displayMessage(selectedRow.project + " - Removed");
					})
					.catch(function (error) {
						displayMessage(error.message, true);
					});
			}

			function editItem() {
				if (!form.validate()) return;

				const selectedRow = grid.selection.getCell().row;
				const data = getItemData();
				dhx.ajax
					.put(URL + selectedRow.id, data)
					.then(function () {
						grid.data.update(selectedRow.id, data);
						displayMessage(selectedRow.project + " - Edited");
					})
					.catch(function (error) {
						displayMessage(error.message, true);
					});
			}

			function addItem() {
				if (!form.validate()) return;

				const data = getItemData();
				dhx.ajax
					.post(URL, data)
					.then(function (res) {
						data.id = res.id;
						grid.data.add(data);
						displayMessage(data.project + " - Added");
					})
					.catch(function (error) {
						displayMessage(error.message, true);
					});
			}

			function getItemData() {
				return { ...form.getValue() };
			}
		</script>
	</body>
</html>
